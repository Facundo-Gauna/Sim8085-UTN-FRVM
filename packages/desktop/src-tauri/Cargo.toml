[package]
name = "sim8085-desktop"
version = "0.3.0"
edition = "2021"
description = "Simulador educativo del Intel 8085 (app de escritorio)"

[lib]
name = "sim8085_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "sim8085-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = "s"
strip = true
