# Compila la app de escritorio en Linux y Windows y deja los instaladores como artefactos.
# Con un tag v*, además publica el release y actualiza los enlaces de descarga de la web.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Pruebas del núcleo
        run: npm test -w @sim8085/core
      - name: Pruebas de la web
        run: npm test -w @sim8085/web
      - name: Pruebas de los scripts
        run: node --test "packages/desktop/scripts/*.test.mjs"
      - name: Pruebas de Rust
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      - run: npm run build -w @sim8085/desktop
      - name: Zip portable de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content packages/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $rel = 'packages/desktop/src-tauri/target/release'
          $dir = New-Item -ItemType Directory -Path "$rel/bundle/portable/Sim8085"
          Copy-Item "$rel/sim8085-desktop.exe" "$dir/Sim8085.exe"
          Set-Content "$dir/LEEME.txt" "Sim8085: abrí Sim8085.exe. Necesita Microsoft Edge WebView2 (viene con Windows 11 y Windows 10 actualizado)."
          Compress-Archive -Path $dir -DestinationPath "$rel/bundle/portable/Sim8085_${v}_x64-portable.zip"
      - run: node packages/desktop/scripts/collect-downloads.mjs --out dist-downloads
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: dist-downloads/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result != 'cancelled'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          fail_on_unmatched_files: false

  # Apunta los botones de descarga de la web al release recién publicado.
  # Solo corre si compilaron los dos sistemas y el release se publicó.
  manifest:
    needs: [build, release]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: ${{ runner.temp }}/instaladores
          merge-multiple: true
      - name: Actualizar el manifiesto de descargas
        run: >
          node packages/desktop/scripts/update-manifest.mjs
          --bundles "$RUNNER_TEMP/instaladores"
          --version "${GITHUB_REF_NAME#v}"
          --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
      - name: Commit y push a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(web): manifiesto de descargas apuntando al release $GITHUB_REF_NAME" packages/web/public/downloads/manifest.json
          git pull --rebase
          git push
